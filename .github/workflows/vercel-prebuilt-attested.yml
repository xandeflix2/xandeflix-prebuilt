name: Vercel Prebuilt attested build only

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed commit SHA on governance/canon-01-hardening
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
  VERCEL_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/vercel-prebuilt-contract.mjs context
      - run: npm ci
      - run: npm run canon:check
      - run: npm run canon:test
      - run: npm run c11:new-device:lock
      - run: npm run typecheck
      - run: npm run update:check
      - run: npm run security:check
      - run: npm run playback:check
      - run: npm run build
      - run: npm run site:build
      - run: node scripts/test-site-build-contract.mjs
      - run: node scripts/test-vercel-artifact-contract.mjs
      - run: node scripts/verify-vercel-artifact.mjs inspect
      - run: node scripts/test-vercel-prebuilt-contract.mjs
      - name: Install reviewed CLI outside source tree
        run: npm install --prefix "$RUNNER_TEMP/xandeflix-vercel" --no-save --package-lock=false --ignore-scripts vercel@64.7.0
      - name: Inspect existing project and create local link only
        run: node scripts/vercel-prebuilt-contract.mjs link
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_BUILD_READ_TOKEN }}
      - name: Real Vercel CLI Preview build without credentials
        run: node scripts/vercel-prebuilt-contract.mjs build
      - name: Inspect and package actual Build Output API payload
        run: node scripts/vercel-prebuilt-contract.mjs package
      - name: Transfer unattested candidate within this run
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unattested-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/canon-01-a22a-package/prebuilt.tar
          if-no-files-found: error
          retention-days: 1

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unattested-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/canon-01-a22a-package
      - name: Recheck same-run source, project and packaged bytes
        run: node scripts/vercel-prebuilt-contract.mjs check-package
      - name: Sign real build provenance with GitHub OIDC
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: tmp/canon-01-a22a-package/prebuilt.tar
      - name: Verify signature, certificate identity and artifact before final upload
        run: node scripts/vercel-prebuilt-contract.mjs verify
        env:
          GH_TOKEN: ${{ github.token }}
          PREBUILT_ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
      - name: Retain verified artifact and signature bundle only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: attested-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/canon-01-a22a-package/prebuilt.tar
            tmp/canon-01-a22a-package/attestation.sigstore.json
            tmp/canon-01-a22a-package/verification.json
            tmp/canon-01-a22a-package/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
